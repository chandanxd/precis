services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
    environment:
      - PRECIS_ENV=production
      - PRECIS_SECRET=${PRECIS_SECRET:?Set PRECIS_SECRET to a long random string}
      - PRECIS_DATA_DIR=/app/chroma_data
      - PRECIS_CORS_ORIGINS=${PRECIS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - PRECIS_OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Report an unreachable Ollama as an error instead of serving canned mock answers
      - PRECIS_STRICT_OLLAMA=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
